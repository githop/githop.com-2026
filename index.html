<!doctype html>
<html lang="en" data-theme="dragon">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>githop</title>
    <meta name="description" content="githop — software engineer." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#181616" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link
      rel="alternate"
      type="text/markdown"
      href="/resume?format=md"
      title="Résumé (Markdown)"
    />
    <!--script:theme-->
    <!--styles:home-->
    <script type="module" src="/src/client/main.ts"></script>
  </head>
  <body class="home">
    <div id="topo" class="topo" aria-hidden="true"><!--topo:layer--></div>
    <main>
      <h1>Tom Hopkins</h1>
      <p>
        Programmer and outdoor enthusiast. I live and work in sunny Boulder
        Colorado.
      </p>
      <nav aria-label="Primary">
        <a href="/resume">Resume</a>
        <a href="https://github.com/githop" rel="me">GitHub</a>
      </nav>
    </main>
    <footer>
      <button id="new-terrain" type="button" disabled>New terrain</button>
      <span
        >seed <output id="topo-seed"><!--topo:seed--></output></span
      >
    </footer>
    <button
      class="theme-toggle"
      type="button"
      aria-label="Toggle color theme"
      data-theme-toggle
    >
      <svg
        class="theme-to-light"
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
      </svg>
      <svg
        class="theme-to-dark"
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>
  </body>
</html>
